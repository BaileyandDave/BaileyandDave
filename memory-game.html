<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bailey & Dave Memory Match</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #fffaf0;
      color: #25313c;
      text-align: center;
    }

    .game-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 18px 12px;
      flex-wrap: wrap;
    }

    .game-nav a {
      background: white;
      color: #263746;
      text-decoration: none;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 30px;
      box-shadow: 0 4px 14px rgba(0,0,0,.10);
    }

    header {
      background: linear-gradient(135deg,#eee6ff,#fff1b8);
      padding: 28px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 38px;
    }

    header p {
      font-size: 18px;
      margin-bottom: 0;
    }

    main {
      width: min(760px, 94%);
      margin: 30px auto 60px;
    }

    .instructions {
      font-size: 18px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .card {
      aspect-ratio: 1 / 1;
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      perspective: 800px;
      -webkit-tap-highlight-color: transparent;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .4s;
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      box-shadow: 0 5px 14px rgba(0,0,0,.15);
    }

    .card-front {
      background: #263746;
      color: white;
      font-size: 42px;
    }

    .card-back {
      background: white;
      transform: rotateY(180deg);
      padding: 8px;
      flex-direction: column;
      font-size: 17px;
      font-weight: bold;
    }

    .character {
      font-size: 42px;
      margin-bottom: 6px;
    }

    #finished {
      display: none;
      background: #fff0b8;
      padding: 28px;
      border-radius: 24px;
      margin-top: 30px;
    }

    #finished h2 {
      font-size: 30px;
      margin-top: 0;
    }

    .play-again {
      border: none;
      background: #263746;
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 30px;
      }

      .memory-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .card-front {
        font-size: 34px;
      }

      .character {
        font-size: 34px;
      }

      .card-back {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="game-nav">
    <a href="index.html">🏠 Quit Game</a>
    <a href="activities.html">🧩 Back to Activities</a>
  </div>

  <header>
    <h1>🧠 Bailey & Dave Memory Match</h1>
    <p>Can you find all the matching pairs?</p>
  </header>

  <main>

    <div class="instructions">
      Tap two cards to turn them over.<br>
      If they match, they stay open!
    </div>

    <div class="memory-grid" id="memoryGrid"></div>

    <div id="finished">
      <h2>🎉 Brilliant! You matched everyone!</h2>
      <p>Bailey and Dave knew you could do it.</p>

      <button class="play-again" onclick="location.reload()">
        Play Again 🐾
      </button>
    </div>

  </main>

  <script>

    const characters = [
      { name: "Bailey", icon: '<img src="bailey-character-1.png" alt="Bailey" style="width:70px;height:70px;object-fit:contain;border-radius:12px;">' },
      { name: "Dave", icon: '<img src="dave-character-close.png" alt="Dave" style="width:70px;height:70px;object-fit:contain;border-radius:12px;">' },
      { name: "Freddie", icon: '<img src="freddie-character-clean.png" alt="Freddie" style="width:70px;height:70px;object-fit:contain;border-radius:12px;">' },
      { name: "Sparkle", icon: '<img src="sparkle-character-clean.png" alt="Sparkle" style="width:70px;height:70px;object-fit:contain;border-radius:12px;">' },
      { name: "Mr Crab", icon: '<img src="mr-crab-character.png" alt="Mr Crab" style="width:70px;height:70px;object-fit:contain;border-radius:12px;">' },
      { name: "Reindeer", icon: '<img src="rudolph-character-larger.png" alt="Rudolph" style="width:70px;height:70px;object-fit:contain;border-radius:12px;">' },
    ];

    let cards = [...characters, ...characters];

    cards.sort(() => Math.random() - 0.5);

    const grid = document.getElementById("memoryGrid");

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let matches = 0;

    cards.forEach((character, index) => {

      const card = document.createElement("button");

      card.className = "card";
      card.dataset.name = character.name;

      card.innerHTML = `
        <div class="card-inner">

          <div class="card-front">
            🐾
          </div>

          <div class="card-back">
            <div class="character">${character.icon}</div>
            ${character.name}
          </div>

        </div>
      `;

      card.addEventListener("click", () => flipCard(card));

      grid.appendChild(card);
    });

    function flipCard(card) {

      if (lockBoard) return;
      if (card === firstCard) return;
      if (card.classList.contains("matched")) return;

      card.classList.add("flipped");

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;

      checkMatch();
    }

    function checkMatch() {

      if (firstCard.dataset.name === secondCard.dataset.name) {

        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        firstCard.classList.remove("flipped");
        secondCard.classList.remove("flipped");

        matches++;

        resetTurn();

        if (matches === characters.length) {
          setTimeout(finishGame, 500);
        }

      } else {

        lockBoard = true;

        setTimeout(() => {

          firstCard.classList.remove("flipped");
          secondCard.classList.remove("flipped");

          resetTurn();

        }, 900);
      }
    }

    function resetTurn() {

      firstCard = null;
      secondCard = null;
      lockBoard = false;
    }

    function finishGame() {

      document.getElementById("finished").style.display = "block";

      document.getElementById("finished").scrollIntoView({
        behavior: "smooth"
      });
    }

  </script>

</body>
</html>
