 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bailey & Dave Treat Counter Challenge</title>
<style>
    .level-box {
    margin: 20px 0 25px;
    text-align: center;
}

.level-box h2 {
    color: #1f3557;
    margin-bottom: 15px;
}

.level-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.level-button {
    min-width: 150px;
    padding: 14px 18px;
    border: none;
    border-radius: 18px;
    background: white;
    color: #1f3557;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.12);
}

.level-button:hover {
    transform: translateY(-2px);
}

.level-button span {
    display: block;
    font-size: 0.9rem;
    margin-top: 4px;
    font-weight: normal;
}

body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #fff8ed;
    padding: 20px;
}

h1 {
    color: #8b4513;
}

.game-box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
}


button {
    font-size: 22px;
    padding: 12px 25px;
    margin: 8px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: #d2691e;
    color: white;
}

button:hover {
    opacity: 0.8;
}
button:hover {
    opacity: 0.8;
}

.treats {
    font-size: 35px;
    margin: 15px;
}

.message {
    font-size: 22px;
    min-height: 40px;
}

    .score {
    font-size: 20px;
    margin-top: 15px;
}

.dog-box {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
}

.dog-box > div {
    width: 48%;
    min-width: 0;
    text-align: center;
}

.dog-box h3 {
    font-size: 1.05rem;
    margin: 10px 0;
}

.dog-image {
    width: 100%;
    max-width: 150px;
    height: auto;
}

.dog-box p {
    font-size: 1.25rem;
    line-height: 1.4;
    margin: 8px 0 15px;
    overflow-wrap: anywhere;
}

</style>

</head>

<body>

<div class="game-box">

<h1>🐾 Bailey & Dave<br> Treat Counter Challenge</h1>

<p>How many treats have Bailey and Dave found?</p>

<div id="dogs"></div>

<h2 id="question"></h2>

<div id="answers"></div>

<div class="message" id="message"></div>

<div class="score">
Treats Found: <span id="score">0</span>
</div>

<br>

<button onclick="newQuestion()">New Treat Hunt</button>
<br>

<button onclick="window.location.href='../index.html'">
🏠 Quit Game
</button>

<button onclick="window.location.href='../activities.html'">
🧩 Back to Activities
</button>
</div>


<script>

let score = 0;
let answer = 0;
let maxTreats = 5;

/* CREATE THE LEVEL BUTTONS */

const levelBox = document.createElement("div");

levelBox.className = "level-box";

levelBox.innerHTML =
    "<h2>Choose a Level</h2>" +
    "<div class='level-buttons'>" +
    "<button class='level-button' onclick='setLevel(5, \"Bailey Beginner\")'>" +
    "🐶 Bailey Beginner<span>1–5 treats</span></button>" +
    "<button class='level-button' onclick='setLevel(10, \"Dave’s Challenge\")'>" +
    "🐾 Dave's Challenge<span>1–10 treats</span></button>" +
    "<button class='level-button' onclick='setLevel(20, \"Super Sausage\")'>" +
    "🌭 Super Sausage<span>1–20 treats</span></button>" +
    "</div>";
document.getElementById("dogs").parentNode.insertBefore(
    levelBox,
    document.getElementById("dogs")
);


/* CHANGE DIFFICULTY */
function setLevel(max, name) {

    maxTreats = max;
    score = 0;

    document.getElementById("score").innerText = score;

    document.getElementById("message").innerText =
        "🎮 " + name + " selected!";

    newQuestion();
}


/* CREATE A NEW QUESTION */
function newQuestion(){

    let bailey = Math.floor(Math.random() * (maxTreats - 1)) + 1;
let dave = Math.floor(Math.random() * (maxTreats - bailey)) + 1;

    answer = bailey + dave;

    document.getElementById("dogs").innerHTML =

        "<div class='dog-box'>" +

        "<div>" +
        "<h3>🐶 Bailey found:</h3>" +
        "<img src='../images/bailey-counter.png' class='dog-image'>" +
        "<p>" +
        "🍪".repeat(bailey) +
        "</p>" +
        "</div>" +

        "<div>" +
        "<h3>🐾 Dave found:</h3>" +
        "<img src='../images/dave-counter.png' class='dog-image'>" +
        "<p>" +
        "🍪".repeat(dave) +
        "</p>" +
        "</div>" +

        "</div>";

    document.getElementById("question").innerText =
        bailey + " + " + dave + " = ?";

    let options = [
        answer,
        answer + 1,
        answer - 1
    ];

    options.sort(() => Math.random() - 0.5);

    let buttons = "";

    options.forEach(function(number){

        buttons +=
            "<button onclick='checkAnswer(" +
            number +
            ")'>" +
            number +
            "</button>";

    });

    document.getElementById("answers").innerHTML = buttons;

    document.getElementById("message").innerText = "";
}


/* CHECK THE CHILD'S ANSWER */
function checkAnswer(number){

    if(number === answer){

        score++;

        document.getElementById("score").innerText = score;

        document.getElementById("message").innerText =
            "🎉 Well done! Bailey and Dave found the treats!";

    }
    else{

        document.getElementById("message").innerText =
            "🐶 Not quite! Have another try!";

    }

}


/* START GAME */
newQuestion();

</script>


    


</body>
</html>
