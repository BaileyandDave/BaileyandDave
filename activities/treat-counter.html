<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bailey & Dave Treat Counter Challenge</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #fff8ed;
    padding: 20px;
}

h1 {
    color: #8b4513;
}

.game-box {
    background: white;
    max-width: 500px;
    margin: auto;
    padding: 25px;
    border-radius: 15px;
}

button {
    font-size: 22px;
    padding: 12px 25px;
    margin: 8px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    background: #d2691e;
    color: white;
}

button:hover {
    opacity: 0.8;
}

.treats {
    font-size: 35px;
    margin: 15px;
}

.message {
    font-size: 22px;
    min-height: 40px;
}

.score {
    font-size: 20px;
    margin-top: 15px;
}
</style>

</head>

<body>

<div class="game-box">

<h1>🐾 Bailey & Dave<br> Treat Counter Challenge</h1>

<p>How many treats have Bailey and Dave found?</p>

<div id="dogs"></div>

<h2 id="question"></h2>

<div id="answers"></div>

<div class="message" id="message"></div>

<div class="score">
Treats Found: <span id="score">0</span>
</div>

<br>

<button onclick="newQuestion()">New Treat Hunt</button>
<br>

<button onclick="window.location.href='../activities.html'">
🏠 Back to Activities
</button>

<button onclick="window.location.href='../index.html'">
❌ Quit Game
</button>
</div>


<script>

let score = 0;
let answer = 0;

function newQuestion(){

    let bailey = Math.floor(Math.random()*6)+1;
    let dave = Math.floor(Math.random()*6)+1;

    answer = bailey + dave;

    document.getElementById("dogs").innerHTML =
    "🐶 Bailey found:<br>" +
    "🍪".repeat(bailey) +
    "<br><br>" +
    "🐾 Dave found:<br>" +
    "🍪".repeat(dave);

    document.getElementById("question").innerHTML =
    bailey + " + " + dave + " = ?";


    let options = [
        answer,
        answer + 1,
        answer - 1
    ];

    options.sort(() => Math.random() - 0.5);


    let buttons = "";

    options.forEach(function(number){

        buttons += 
        "<button onclick='checkAnswer(" + number + ")'>" 
        + number +
        "</button>";

    });

    document.getElementById("answers").innerHTML = buttons;

    document.getElementById("message").innerHTML="";

}


function checkAnswer(number){

    if(number == answer){

        score++;

        document.getElementById("score").innerHTML = score;

        document.getElementById("message").innerHTML =
        "🎉 Well done! Bailey and Dave found the treats!";

    }
    else{

        document.getElementById("message").innerHTML =
        "🐶 Not quite! Have another try!";

    }

}


newQuestion();

</script>


</body>
</html>
